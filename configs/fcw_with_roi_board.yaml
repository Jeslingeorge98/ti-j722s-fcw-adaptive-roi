title: "FCW with Adaptive ROI — J722SXH01EVM"

log_level: 2

# Camera intrinsics scaled from camera_calibration_c270.json (1280x720 baseline)
# to 1918x1136 source: focal scaled by mean(1918/1280, 1136/720)=1.538,
# principal point scaled per axis. Recalibrate when calibration data is available.
roi_config:
  camera:
    focal_length_px: 2165.2
    principal_point_x_px: 953.0
    principal_point_y_px: 553.0
    image_width_px: 1918
    image_height_px: 1136
    mounting_height_m: 1.5       # update with tape measure on actual vehicle
  isa_enabled: true
  can_mode: mock
  can_csv: /opt/online_test_data/can_signals_indian_road_curve_30fps.csv

inputs:
  input0:
    source: /opt/online_test_data/indian_road_curve_30fps.mp4
    format: mp4
    width: 1918
    height: 1136
    framerate: 30
    loop: False

models:
  model0:
    model_path: /opt/model_zoo/LD-ufldv2-culane-exp01-res18-256x640
    viz_threshold: 0.6
    core_id: 2
    overlay_detection_model: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
    overlay_detection_threshold: 0.4
    overlay_detection_core: 1

outputs:
  output0:
    sink: /opt/online_test_data/output/output_fcw_roi_curve.mkv
    width: 1280
    height: 720

flows:
  flow0: [input0, model0, output0]
