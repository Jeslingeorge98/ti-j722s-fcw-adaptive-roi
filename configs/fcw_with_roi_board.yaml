title: "FCW with Adaptive ROI — J722SXH01EVM"

log_level: 2

# Camera intrinsics from camera_calibration_c270.json (1280x720 calibration)
# focal_length_px: mean(fx_px=1406.72, fy_px=1408.83)
roi_config:
  camera:
    focal_length_px: 1407.8
    principal_point_x_px: 636.0
    principal_point_y_px: 350.4
    image_width_px: 1280
    image_height_px: 720
    mounting_height_m: 1.5       # update with tape measure on actual vehicle
  isa_enabled: true
  can_mode: mock
  can_csv: /opt/online_test_data/can_signals_indian_road1.csv

inputs:
  input0:
    source: /opt/online_test_data/test_mp4/indian_road1_720p.mp4
    format: mp4
    width: 1280
    height: 720
    framerate: 30
    loop: False

models:
  model0:
    model_path: /opt/model_zoo/LD-ufldv2-culane-exp01-res18-256x640
    viz_threshold: 0.6
    core_id: 2
    overlay_detection_model: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
    overlay_detection_threshold: 0.4
    overlay_detection_core: 1

outputs:
  output0:
    sink: kmssink
    width: 1920
    height: 1080
    overlay-perf-type: graph

  output1:
    sink: /opt/online_test_data/output/output_fcw_roi_indian_road1.mkv
    width: 1280
    height: 720

flows:
  flow0: [input0, model0, output0, [320, 176, 1280, 720]]
  flow1: [input0, model0, output1]
