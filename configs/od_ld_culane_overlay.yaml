title: "CULane Lane Detection + Object Detection"
log_level: 2
inputs:
    input0:
        source: /dev/video-usb-cam0
        format: jpeg
        width: 1280
        height: 720
        framerate: 30
    input1:
        source: /opt/edgeai-test-data/videos/video0_1280_768.h264
        format: h264
        width: 1280
        height: 768
        framerate: 30
        loop: True
    input2:
        source: /opt/edgeai-test-data/images/%04d.jpg
        width: 1280
        height: 720
        index: 0
        framerate: 1
        loop: True
    # Host test set copied to the EVM from ~/Documents/Test_videos
    # Test_1: highway, clear lane markings, light traffic (see READ_ME).
    # 1280x720 @ 25 fps -- the pipeline is source-limited, so 25 fps is the cap.
    input3:
        source: /opt/online_test_data/test_mp4/indian_road1_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input4:
        source: /opt/online_test_data/test_mp4/indian_road2_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input5:
        source: /opt/online_test_data/test_mp4/indian_road3_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input6:
        source: /opt/online_test_data/test_mp4/indian_road4_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input7:
        source: /opt/online_test_data/test_mp4/indian_road6_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input8:
        source: /opt/online_test_data/test_mp4/indian_road_evening_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input9:
        source: /opt/online_test_data/test_mp4/indian_road_night1_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input10:
        source: /opt/online_test_data/test_mp4/indian_road_night2_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input11:
        source: /opt/online_test_data/test_mp4/indian_road_rain_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
    input12:
        source: /opt/online_test_data/test_mp4/indian_road_toll_720p.mp4
        format: mp4
        width: 1280
        height: 720
        framerate: 30
        loop: False
models:
    # Lane detection runs as the flow's own model -> c7x_1 (core_id 2).
    # Object detection is drawn onto the SAME frame by the lane post-process,
    # which builds its own runtime for it -> c7x_0 (overlay_detection_core 1).
    # One flow, one mosaic window, one display sink; both C7x cores busy.
    model0:
        model_path: /opt/model_zoo/LD-ufldv2-culane-exp01-res18-256x640
        viz_threshold: 0.6
        core_id: 2
        overlay_detection_model: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        overlay_detection_threshold: 0.4
        overlay_detection_core: 1

outputs:
  output0:
    sink: kmssink
    width: 1920
    height: 1080
    overlay-perf-type: graph

  output4:
    sink: /opt/online_test_data/output/output_indian_road1_720p.mkv
    width: 1280
    height: 720

  output5:
    sink: /opt/online_test_data/output/output_indian_road2_720p.mkv
    width: 1280
    height: 720

  output6:
    sink: /opt/online_test_data/output/output_indian_road3_720p.mkv
    width: 1280
    height: 720

  output7:
    sink: /opt/online_test_data/output/output_indian_road4_720p.mkv
    width: 1280
    height: 720

  output8:
    sink: /opt/online_test_data/output/output_indian_road6_720p.mkv
    width: 1280
    height: 720

  output9:
    sink: /opt/online_test_data/output/output_indian_road_evening_720p.mkv
    width: 1280
    height: 720

  output10:
    sink: /opt/online_test_data/output/output_indian_road_night1_720p.mkv
    width: 1280
    height: 720

  output11:
    sink: /opt/online_test_data/output/output_indian_road_night2_720p.mkv
    width: 1280
    height: 720

  output12:
    sink: /opt/online_test_data/output/output_indian_road_rain_720p.mkv
    width: 1280
    height: 720

  output13:
    sink: /opt/online_test_data/output/output_indian_road_toll_720p.mkv
    width: 1280
    height: 720

flows:
  # input3: HDMI + individual recording
  flow0:  [input9, model0, output0, [320,176,1280,720]]
  flow1:  [input9, model0, output10]